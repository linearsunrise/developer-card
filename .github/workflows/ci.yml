name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: card
          POSTGRES_PASSWORD: card
          POSTGRES_DB: card_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U card -d card_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://card:card@localhost:5433/card_test?schema=public
      TEST_DATABASE_URL: postgresql://card:card@localhost:5433/card_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: docker compose up --build --wait
      - run: docker compose logs
        if: failure()
      - run: docker compose down -v
        if: always()
